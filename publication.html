  <style>
    /* ===== Simple publication layout ===== */
    .pub-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .pub-row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      padding: 20px 0;
      border-top: 1px solid #dcdcdc;
    }

    .pub-left {
      flex: 0 0 520px;
      max-width: 520px;
    }

    .pub-media {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      border: none;
      object-fit: cover;
      background: #000;
    }

    .pub-right {
      flex: 1;
      min-width: 0;
    }

    .pub-title {
      font-size: 18px;
      font-weight: 700;
      color: #000;
      text-decoration: none;
      line-height: 1.3;
      display: inline-block;
      margin-bottom: 6px;
    }

    .pub-title:hover { text-decoration: underline; }

    .pub-authors {
      color: #6a1bb1;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .pub-venue {
      font-style: italic;
      margin-bottom: 8px;
    }

    .pub-links a {
      color: #1a0dab;
      text-decoration: none;
      margin-right: 10px;
    }

    .pub-links a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .pub-row { flex-direction: column; }
      .pub-left { max-width: 100%; }
    }
  </style>
</head>

<!-- ================= MEDIA AUTO-DETECT SCRIPT ================= -->
<script>
  document.querySelectorAll('.pub-row').forEach(row => {
    const mediaUrl = row.dataset.media;
    const container = row.querySelector('.pub-left');

    if (!mediaUrl) return;

    // YouTube
    if (mediaUrl.includes('youtube.com') || mediaUrl.includes('youtu.be')) {
      const videoId = mediaUrl.split('v=')[1] || mediaUrl.split('/').pop();
      container.innerHTML = `
        <iframe class="pub-media"
          src="https://www.youtube.com/embed/${videoId}"
          allowfullscreen>
        </iframe>`;
    }

    // MP4 / WebM video
    else if (mediaUrl.match(/\.(mp4|webm)$/i)) {
      container.innerHTML = `
        <video class="pub-media" controls>
          <source src="${mediaUrl}">
        </video>`;
    }

    // Image / GIF
    else if (mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
      container.innerHTML = `
        <img class="pub-media" src="${mediaUrl}" alt="Publication media">`;
    }

    // Fallback
    else {
      container.innerHTML = `
        <img class="pub-media" src="${mediaUrl}" alt="Publication media">`;
    }
  });
</script>
